 const q=queue(), tot=DECK.filter(pass).length;
 $('count').textContent=q.length?`${tot-q.length+1} of ${tot}`:`${tot} of ${tot}`;
 $('lc').textContent=S.liked.length;
 const d=$('deck');d.innerHTML='';
 if(!q.length){d.innerHTML=`<div class="empty"><div class="big">🏖️</div><b>That's all of them${S.price!=='all'||S.cat!=='all'?' for this filter':''}.</b><p>${S.liked.length} liked so far.</p><button class="cta" onclick="tab('liked')">See liked</button>${S.price!=='all'||S.cat!=='all'?'<button class="cta alt" onclick="S.price=\'all\';S.cat=\'all\';save();render()">Show all</button>':''}</div>`}
 q.slice(0,2).reverse().forEach((c,i,a)=>{const el=document.createElement('div');el.className='sc'+(i<a.length-1?' under':'');el.innerHTML=cardHTML(c);el.dataset.id=c.id;d.appendChild(el);if(i===a.length-1)drag(el)});
 $('bUndo').disabled=!S.hist.length;$('bNo').disabled=$('bYes').disabled=!q.length;
 renderList();
}
function decide(like,el){
 const q=queue();if(!q.length)return;const c=q[0];
 el=el||$('deck').querySelector('.sc:not(.under)');
 S.dec[c.id]=like?'l':'p';S.hist.push(c.id);if(like&&!S.liked.includes(c.id))S.liked.push(c.id);save();
 if(el){el.classList.remove('drag');el.style.transform=`translateX(${like?130:-130}%) rotate(${like?18:-18}deg)`;el.style.opacity=0;el.querySelector(like?'.st-l':'.st-p').style.opacity=1;el.style.pointerEvents='none'}
 if(like)toast('♥ Saved to Liked');
 setTimeout(render,260);
}
function undo(){const id=S.hist.pop();if(!id)return;delete S.dec[id];S.liked=S.liked.filter(x=>x!==id);
 const c=byId[id];if(c&&!pass(c)){S.price='all';S.cat='all'}save();render();toast('↶ Undone')}
function drag(el){
 let x0=0,y0=0,dx=0,on=false,id=null,horiz=null;
 el.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;on=true;id=e.pointerId;x0=e.clientX;y0=e.clientY;dx=0;horiz=null;el.classList.add('drag')});
 el.addEventListener('pointermove',e=>{if(!on||e.pointerId!==id)return;const mx=e.clientX-x0,my=e.clientY-y0;
  if(horiz===null&&(Math.abs(mx)>8||Math.abs(my)>8)){horiz=Math.abs(mx)>Math.abs(my);if(horiz)try{el.setPointerCapture(id)}catch(_){}}
  if(!horiz)return;dx=mx;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
  el.querySelector('.st-l').style.opacity=Math.max(0,Math.min(1,dx/90));el.querySelector('.st-p').style.opacity=Math.max(0,Math.min(1,-dx/90))});
 const end=e=>{if(!on)return;on=false;el.classList.remove('drag');
  if(horiz&&Math.abs(dx)>90)decide(dx>0,el);else{el.style.transform='';el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function renderList(){
 const L=S.liked.map(id=>byId[id]).filter(Boolean);
 $('lsum').textContent=L.length?`${L.length} pair${L.length>1?'s':''} · ${money(L.reduce((a,c)=>a+c.price,0))} total`:'';
 $('list').innerHTML=L.length?L.map(c=>`<div class="lc"><div class="th" style="background-image:url('${esc(c.img)}')"></div><div class="lb"><button class="rm" data-rm="${c.id}" aria-label="Remove">✕</button>
  <h3>${esc(c.brand)} ${esc(c.name)}</h3><div class="col" style="font-size:.78rem;color:var(--mute)">${esc(c.color)} · size ${c.sizes.join(' & ')}</div>
  <div class="p">${money(c.price)} <small>at ${esc(c.seller)}${c.delivered!=null&&c.shipping?` · ≈${money(c.delivered)} delivered`:c.shipping===0?' · free shipping':''}</small></div>
  <div class="r">↩ ${esc(c.returnWindow)} · ${esc(c.returnShipping)}</div><a href="${esc(c.url)}" target="_blank" rel="noopener">Open listing ↗</a></div></div>`).join('')
  :'<div class="lempty">Nothing liked yet. Swipe right on shoes you like.</div>';
}
$('list').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;S.liked=S.liked.filter(x=>x!==b.dataset.rm);save();renderList();$('lc').textContent=S.liked.length};
function tab(t){$('tSwipe').classList.toggle('on',t==='swipe');$('tLiked').classList.toggle('on',t==='liked');$('vSwipe').hidden=t!=='swipe';$('vLiked').hidden=t!=='liked';scrollTo(0,0)}
$('tSwipe').onclick=()=>tab('swipe');$('tLiked').onclick=()=>tab('liked');
$('bNo').onclick=()=>decide(false);$('bYes').onclick=()=>decide(true);$('bUndo').onclick=undo;
$('reset').onclick=()=>{if(confirm('Start over? This clears your swipes and Liked list.')){S={dec:{},liked:[],hist:[],price:'all',cat:'all'};save();render();tab('swipe')}};
document.addEventListener('keydown',e=>{if($('vSwipe').hidden)return;if(e.key==='ArrowRight')decide(true);else if(e.key==='ArrowLeft')decide(false);else if(e.key==='z'||e.key==='Backspace'){e.preventDefault();undo()}});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1300)}
render();
</script></body></html>
